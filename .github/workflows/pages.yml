# Publishes the terminal (bot/web) to GitHub Pages:  https://<user>.github.io/<repo>/
# The page is a static client; on first open it asks for your bot's URL + DASHBOARD_TOKEN.
name: Deploy terminal to GitHub Pages

on:
  push:
    paths: ["bot/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bot/web
      - id: deployment
        uses: actions/deploy-pages@v4
