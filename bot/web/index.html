<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1411">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bot">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Bot Terminal</title>
<style>
  :root {
    --bg: #0a0d0b; --panel: #0f1411; --line: #1c2620; --fg: #c8d6cc; --dim: #5f7366;
    --green: #4ade80; --red: #f87171; --amber: #fbbf24; --cyan: #67e8f9; --violet: #c4b5fd; --blue: #93c5fd;
    --font: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.5 var(--font); overscroll-behavior: none; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  #bar { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center;
         padding: calc(8px + var(--sat)) calc(16px + var(--sar)) 8px calc(16px + var(--sal));
         background: var(--panel); border-bottom: 1px solid var(--line); white-space: nowrap; }
  #bar .k { color: var(--dim); }
  #bar .v { font-variant-numeric: tabular-nums; }
  .pill { padding: 0 8px; border-radius: 3px; font-weight: 700; letter-spacing: .05em; }
  .RUNNING { background: #14532d; color: var(--green); }
  .PAUSED  { background: #422006; color: var(--amber); }
  .HALTED, .OFFLINE  { background: #450a0a; color: var(--red); }
  .CONNECTING { background: var(--line); color: var(--dim); }
  .LIVE    { background: var(--red); color: #000; }
  #spark { color: var(--cyan); letter-spacing: -1px; flex: 1 1 160px; overflow: hidden; text-align: right; }
  #gear { color: var(--dim); padding: 2px 4px; margin-left: auto; }

  #log { flex: 1; overflow-y: auto; padding: 10px calc(16px + var(--sar)) 10px calc(16px + var(--sal));
         white-space: pre-wrap; word-break: break-word; -webkit-overflow-scrolling: touch; }
  .ln { display: flex; gap: 10px; }
  .ts { color: var(--dim); flex: none; }
  .lv { flex: none; min-width: 6ch; white-space: nowrap; }
  .info .lv { color: var(--blue); }   .trade .lv, .trade .m { color: var(--green); }
  .ai .lv, .ai .m { color: var(--violet); }  .evolve .lv, .evolve .m { color: var(--cyan); }
  .warn .lv, .warn .m { color: var(--amber); }  .error .lv, .error .m, .risk .lv, .risk .m { color: var(--red); }
  .sell .m { color: #fca5a5; }
  .cmd { color: var(--fg); margin-top: 6px; } .cmd b { color: var(--green); }
  .reply { color: var(--fg); padding-left: 2ch; border-left: 2px solid var(--line); margin: 2px 0 8px; overflow-x: auto; white-space: pre; }
  .reply.wrap { white-space: pre-wrap; }

  #chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px calc(16px + var(--sar)) 0 calc(16px + var(--sal));
           border-top: 1px solid var(--line); background: var(--panel); scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  #chips button { flex: none; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--fg); background: var(--bg); }
  #chips button:active { background: var(--line); }
  #chips .danger { color: var(--red); border-color: #3f1d1d; }
  #prompt { display: flex; align-items: center; gap: 8px;
            padding: 10px calc(16px + var(--sar)) calc(10px + var(--sab)) calc(16px + var(--sal)); background: var(--panel); }
  #prompt span { color: var(--green); }
  #in { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--fg); font: inherit; caret-color: var(--green); }
  #send { color: var(--green); padding: 4px 8px; display: none; }
  #conn { color: var(--dim); }

  #setup { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px;
           background: rgba(0,0,0,.75); z-index: 10; }
  #setup.open { display: flex; }
  #setup form { width: 100%; max-width: 440px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
  #setup h2 { margin: 0 0 4px; font-size: 15px; color: var(--green); }
  #setup p { margin: 0 0 14px; color: var(--dim); }
  #setup label { display: block; margin: 10px 0 4px; color: var(--dim); }
  #setup input { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; color: var(--fg); font: 16px var(--font); }
  #setup .row { display: flex; gap: 8px; margin-top: 16px; }
  #setup .row button { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid var(--line); }
  #setup .primary { background: #14532d; color: var(--green); border-color: #14532d; }

  @media (max-width: 640px), (pointer: coarse) {
    html, body { font-size: 12.5px; }
    #in { font-size: 16px; }            /* prevents iOS zoom-on-focus */
    #send { display: block; }
    .ts, #spark { display: none; }
    #bar { gap: 2px 12px; }
  }
</style>
</head>
<body>
<div id="bar">
  <span class="pill CONNECTING" id="state">CONNECTING</span>
  <span><span class="k">eq</span> <span class="v" id="equity">—</span></span>
  <span><span class="k">day</span> <span class="v" id="pnlday">—</span></span>
  <span><span class="k">total</span> <span class="v" id="pnltot">—</span></span>
  <span><span class="k">strat</span> <span class="v" id="ver">—</span></span>
  <span><span class="k">pos</span> <span class="v" id="pos">—</span></span>
  <span><span class="k">broker</span> <span class="v" id="broker">—</span></span>
  <span><span class="k">ai</span> <span class="v" id="ai">—</span></span>
  <span id="spark"></span>
  <button id="gear" title="Connection settings" aria-label="Connection settings">⚙</button>
</div>
<div id="log"></div>
<div id="chips">
  <button data-c="status">status</button>
  <button data-c="positions">positions</button>
  <button data-c="trades">trades</button>
  <button data-c="versions">versions</button>
  <button data-c="evolve">evolve</button>
  <button data-c="ask " data-fill>ask…</button>
  <button data-c="strategy">strategy</button>
  <button data-c="pause">pause</button>
  <button data-c="resume">resume</button>
  <button data-c="mcp">mcp</button>
  <button data-c="help">help</button>
  <button data-c="flatten" class="danger">flatten</button>
</div>
<div id="prompt"><span>bot&gt;</span><input id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="type a command"><button id="send" aria-label="Send">⏎</button><span id="conn">○</span></div>

<div id="setup"><form>
  <h2>Connect to your bot</h2>
  <p>Paste the bot's public address (e.g. your Cloudflare tunnel or server URL) and its DASHBOARD_TOKEN. Saved only on this device.</p>
  <label for="srv">Bot URL</label><input id="srv" type="url" placeholder="https://my-bot.example.com" autocapitalize="off">
  <label for="tok">Access token</label><input id="tok" type="password" placeholder="DASHBOARD_TOKEN" autocapitalize="off">
  <div class="row"><button type="button" id="cancel">Cancel</button><button type="submit" class="primary">Connect</button></div>
</form></div>

<script>
const $ = id => document.getElementById(id);
const log = $("log"), input = $("in");
const CMDS = ["help","status","positions","trades","strategy","params","versions","evolve","rollback","ask","mcp","pause","resume","flatten","reset-halt","clear"];
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d } catch { return d } },
                set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch {} } };
const hist = JSON.parse(store.get("hist", "[]"));
let hi = hist.length, ws, retry = 500, timer;

// ---- where is the bot? ----
// Served by the bot itself -> same origin. Served from GitHub Pages (or anywhere static) -> saved URL.
const params = new URLSearchParams(location.search);
if (params.get("server")) store.set("server", params.get("server"));
if (params.get("token")) store.set("token", params.get("token"));
if (params.has("server") || params.has("token")) history.replaceState(null, "", location.pathname); // keep token out of history
const STATIC_HOST = /github\.io$|^$/.test(location.hostname) || location.protocol === "file:";
const server = () => store.get("server", STATIC_HOST ? "" : location.origin).replace(/\/+$/, "");
const token = () => store.get("token", "");

const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt = n => n == null ? "—" : Number(n).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const sgn = n => n == null ? "—" : (n >= 0 ? "+" : "") + fmt(n);
const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 40;

function add(html, cls) {
  const stick = atBottom();
  const d = document.createElement("div");
  d.className = cls; d.innerHTML = html; log.appendChild(d);
  while (log.childElementCount > 4000) log.firstChild.remove();
  if (stick) log.scrollTop = log.scrollHeight;
}
function event(ev) {
  const t = new Date(ev.ts * 1000).toLocaleTimeString([], {hour12: false});
  const side = ev.data?.fill?.side === "sell" ? " sell" : "";
  add(`<span class="ts">${t}</span><span class="lv">${ev.level.toUpperCase()}</span><span class="m">${esc(ev.msg)}</span>`, `ln ${ev.level}${side}`);
}
function color(el, n) { el.style.color = n == null ? "" : n >= 0 ? "var(--green)" : "var(--red)"; }
function setState(text, cls) { $("state").textContent = text; $("state").className = "pill " + cls; }
function status(s) {
  setState(s.state + (s.evolving ? " · EVOLVING" : ""), s.state);
  $("broker").innerHTML = s.broker === "LIVE" ? '<span class="pill LIVE">LIVE $</span>' : esc(s.broker);
  $("equity").textContent = fmt(s.equity);
  $("pnlday").textContent = sgn(s.pnl_today); color($("pnlday"), s.pnl_today);
  $("pnltot").textContent = sgn(s.pnl_total); color($("pnltot"), s.pnl_total);
  $("ver").textContent = "v" + s.version; $("pos").textContent = s.positions; $("ai").textContent = s.ai;
  const sp = s.spark || [];
  if (sp.length > 1) {
    const lo = Math.min(...sp), hi = Math.max(...sp), bl = "▁▂▃▄▅▆▇█";
    $("spark").textContent = sp.slice(-80).map(v => bl[hi === lo ? 3 : Math.round((v - lo) / (hi - lo) * 7)]).join("");
  }
}
function connect() {
  clearTimeout(timer);
  if (!server()) { openSetup(); setState("NOT CONNECTED", "OFFLINE"); return; }
  if (ws && ws.readyState <= 1) return;
  const u = new URL(server() + "/ws");
  u.protocol = u.protocol === "https:" ? "wss:" : "ws:";
  if (token()) u.searchParams.set("token", token());
  setState("CONNECTING", "CONNECTING");
  ws = new WebSocket(u);
  ws.onopen = () => { $("conn").textContent = "●"; $("conn").style.color = "var(--green)"; retry = 500; };
  ws.onclose = e => {
    $("conn").textContent = "○"; $("conn").style.color = "var(--red)"; setState("OFFLINE", "OFFLINE");
    if (e.code === 4401) { add("unauthorized — tap ⚙ and enter the bot's DASHBOARD_TOKEN", "ln error"); openSetup(); return; }
    timer = setTimeout(connect, retry = Math.min(retry * 2, 10000));
  };
  ws.onmessage = m => {
    const d = JSON.parse(m.data);
    if (d.type === "history") { log.innerHTML = ""; d.events.forEach(event); add("tap a command below or type 'help'", "ln info"); log.scrollTop = log.scrollHeight; }
    else if (d.type === "event") event(d);
    else if (d.type === "status") status(d);
    else if (d.type === "reply") add(esc(d.text), /^ask\b/.test(d.cmd) ? "reply wrap" : "reply");
  };
}
function run(v) {
  v = v.trim(); if (!v) return;
  hist.push(v); if (hist.length > 200) hist.shift(); hi = hist.length; store.set("hist", JSON.stringify(hist));
  add(`<b>bot&gt;</b> ${esc(v)}`, "cmd");
  if (v === "clear") { log.innerHTML = ""; return; }
  if (["flatten", "reset-halt"].includes(v) && !confirm(`Really run '${v}'?`)) return;
  if (ws?.readyState === 1) ws.send(JSON.stringify({cmd: v})); else add("not connected", "ln error");
  log.scrollTop = log.scrollHeight;
}

// ---- setup dialog ----
function openSetup() { $("srv").value = server(); $("tok").value = token(); $("setup").classList.add("open"); }
$("gear").onclick = openSetup;
$("cancel").onclick = () => $("setup").classList.remove("open");
$("setup").querySelector("form").onsubmit = e => {
  e.preventDefault();
  store.set("server", $("srv").value.trim() || null); store.set("token", $("tok").value.trim() || null);
  $("setup").classList.remove("open"); try { ws?.close(); } catch {} ws = null; connect();
};

// ---- input ----
input.addEventListener("keydown", e => {
  if (e.key === "Enter") { run(input.value); input.value = ""; }
  else if (e.key === "ArrowUp") { if (hi > 0) input.value = hist[--hi]; e.preventDefault(); }
  else if (e.key === "ArrowDown") { input.value = hi < hist.length - 1 ? hist[++hi] : (hi = hist.length, ""); e.preventDefault(); }
  else if (e.key === "Tab") {
    e.preventDefault();
    const m = CMDS.filter(c => c.startsWith(input.value)); if (m.length === 1) input.value = m[0] + " ";
    else if (m.length) add(m.join("  "), "reply");
  }
});
$("send").onclick = () => { run(input.value); input.value = ""; };
$("chips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.hasAttribute("data-fill")) { input.value = b.dataset.c; input.focus(); } else run(b.dataset.c);
});
// desktop: clicking the log focuses the prompt (skip on touch so the keyboard doesn't pop up while scrolling)
if (matchMedia("(pointer: fine)").matches) log.addEventListener("click", () => { if (!getSelection().toString()) input.focus(); });
// phones drop sockets in the background: reconnect as soon as the app is visible again
document.addEventListener("visibilitychange", () => { if (!document.hidden) connect(); });
addEventListener("online", connect);
if ("serviceWorker" in navigator && isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});
connect();
</script>
</body>
</html>
